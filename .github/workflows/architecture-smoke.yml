name: Native architecture smoke

on:
  pull_request:
  push:
    branches:
      - feat/native-af-heart-helper
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-architecture-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      KOKORO_EXPECTED_TARGET: ${{ matrix.target }}
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run smoke:architecture:prepare
      - run: bun run smoke:architecture
