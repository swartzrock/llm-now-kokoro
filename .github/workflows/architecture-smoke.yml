name: Native architecture smoke

on:
  pull_request:
  push:
    branches:
      - feat/native-af-heart-helper
      - feat/cross-platform-speech-pack-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-architecture-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
            bun-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-x64-baseline.zip
          - target: darwin-arm64
            runner: macos-15
            bun-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip
          - target: linux-x64
            runner: ubuntu-24.04
            bun-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip
          - target: win32-x64
            runner: windows-2025
            bun-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      KOKORO_EXPECTED_TARGET: ${{ matrix.target }}
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: ${{ matrix.bun-url }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: bun run typecheck
      - run: bun run smoke:architecture:prepare
      - run: bun run smoke:architecture
      - run: bun run release:validate
